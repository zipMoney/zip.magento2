# Everything needed to put a branch of this plugin on its QA store.
# Included from .gitlab-ci.yml; nothing here runs on a tag.
#
# Without this the flow was: leave this repo, open zip-au/plugins/zip.magento2.qa.store, Run
# pipeline, remember the variable name, type the branch, then find the deploy
# job. This removes the first four steps.
deploy-to-qa-stand:
  stage: qa-stand
  when: manual
  # A branch is the only thing worth standing up this way. A tag is a release
  # candidate and goes through the store repo directly, where the ref can be
  # typed by hand.
  rules:
    - if: $CI_COMMIT_BRANCH
  variables:
    # The whole point: the downstream store builds THIS branch rather than its
    # own default. PLUGIN_REF is free text there and wins over the dropdown.
    PLUGIN_REF: $CI_COMMIT_REF_NAME
  trigger:
    project: zip-au/plugins/zip.magento2.qa.store
    branch: main
    # `depend` mirrors the store pipeline's outcome back here, so a failed build
    # shows up on your own branch instead of only in the other repo.
    strategy: depend

# ---------------------------------------------------------------------------
# WHAT THIS DOES AND DOES NOT DO
#
# Clicking it builds an image from this branch and pushes it, tagged
# <store-sha>-<branch-slug>-<this-commit>, so two branches can never overwrite
# each other's image.
#
# It does NOT put the branch in front of QA on its own: `deploy-dev` in the
# store repo stays manual. That is deliberate. There is ONE stand per store, so
# deploying replaces whatever somebody else is currently testing — that should
# stay a decision someone makes, not a side effect of clicking build. Follow the
# link this job prints to the downstream pipeline and play `deploy-dev` there.
#
# PERMISSIONS. A manual job runs as the person who clicked it, so you need at
# least Developer on zip-au/plugins/zip.magento2.qa.store. If the trigger is refused, that
# is the first thing to check.
# ---------------------------------------------------------------------------
