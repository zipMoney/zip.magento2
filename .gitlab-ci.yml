# The entry point, and deliberately nothing more: stages, includes, and the name
# a pipeline shows in the list. Every actual job lives in pipelines/.
#
# GitLab has no equivalent of GitHub's sidebar of separate workflow files — one
# project has exactly one pipeline definition. `include` plus `rules` is what
# replaces it: one file per concern, and only the jobs that apply to this ref
# ever appear. Adding a second concern later — a release pipeline, a security
# review, a non-prod deploy — is a new file under pipelines/ and one line here,
# not an edit to a growing monolith.
#
# The release stages are declared now, before anything fills them, so that
# adding a tag-driven publish pipeline later does not have to touch this list.

stages:
  # Branch pipelines. Nothing here touches the released plugin.
  - qa-stand
  # Tag pipelines — reserved.
  - build
  - preview
  - release
  - deploy

include:
  - local: pipelines/qa-stand.yml

# Names the pipeline in the list, so a release and a stand build are told apart
# at a glance instead of by reading their jobs. GitLab has no conditional
# expression for this — the value has to come from a variable set per rule.
workflow:
  name: '$PIPELINE_NAME'
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        PIPELINE_NAME: 'Release $CI_COMMIT_TAG'
    - if: $CI_COMMIT_BRANCH
      variables:
        PIPELINE_NAME: 'QA stand: $CI_COMMIT_REF_NAME'
